name: Verificações

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Usar npm compatível
        run: npm install --global npm@11.19.0 --ignore-scripts
      - name: Instalar dependências sem scripts automáticos
        run: |
          npm ci --ignore-scripts
          npm --prefix web ci --ignore-scripts
      - name: Validar schema
        run: npm run db:validate
      - name: Verificar TypeScript
        run: |
          npm run typecheck
          npm run web:typecheck
      - name: Testar API com banco descartável
        run: npm test
      - name: Compilar API e interface
        run: |
          npm run build
          npm run web:build
